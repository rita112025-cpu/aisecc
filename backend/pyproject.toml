[project]
name = "aisecc-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
# B008: FastAPI Depends() defaults are idiomatic
ignore = ["S101", "S404", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE"]
